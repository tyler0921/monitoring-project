<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceTrack — 강사 대시보드</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e13;--sf:#12151c;--card:#171b24;--bd:#1c2133;
  --gr:#00e5a0;--wa:#f5a623;--da:#ff4d4d;--in:#4da6ff;
  --tx:#dde4f0;--mu:#3a4560;
  --fm:'JetBrains Mono',monospace;--fb:'Noto Sans KR',sans-serif;
}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;display:flex;flex-direction:column}

/* CREATE SCREEN */
#create-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.create-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:36px 32px;width:100%;max-width:440px}
.logo{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--gr);letter-spacing:.12em;margin-bottom:4px}
.logo em{color:var(--mu);font-style:normal}
.logo-sub{font-size:12px;color:var(--mu);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;font-family:var(--fm)}
.field input{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;color:var(--tx);font-family:var(--fb);font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--gr)}
.field input::placeholder{color:var(--mu)}
.btn-create{width:100%;background:var(--gr);color:#0c0e13;border:none;border-radius:8px;padding:12px;font-family:var(--fm);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.06em;transition:opacity .2s}
.btn-create:hover{opacity:.88}
.divider{border:none;border-top:1px solid var(--bd);margin:20px 0}
.server-row{display:flex;gap:8px;align-items:center}
.server-row input{flex:1;font-size:12px}
.server-row span{font-size:11px;color:var(--mu);white-space:nowrap;font-family:var(--fm)}

/* DASHBOARD */
#dashboard{display:none;flex-direction:column;height:100vh;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
.hdr-logo{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--gr);letter-spacing:.1em}
.hdr-logo em{color:var(--mu);font-style:normal}
.hdr-r{display:flex;align-items:center;gap:10px}
.code-badge{font-family:var(--fm);font-size:14px;font-weight:700;letter-spacing:.2em;color:var(--gr);background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.3);border-radius:8px;padding:4px 14px;cursor:pointer;transition:background .2s}
.code-badge:hover{background:rgba(0,229,160,.2)}
.code-label{font-family:var(--fm);font-size:10px;color:var(--mu)}
.conn-chip{display:flex;align-items:center;gap:4px;font-family:var(--fm);font-size:10px;color:var(--mu)}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--mu)}
.cdot.ok{background:var(--gr)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bd);gap:1px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sc{background:var(--sf);padding:8px 14px}
.sl{font-family:var(--fm);font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.sv{font-family:var(--fm);font-size:17px;font-weight:700}

.body-area{display:grid;grid-template-columns:1fr 300px;gap:0;flex:1;min-height:0;overflow:hidden}
.grid-area{padding:12px 14px;overflow-y:auto}
.grid-area::-webkit-scrollbar{width:4px}
.grid-area::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.grid-label{font-family:var(--fm);font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.no-students{padding:40px 0;text-align:center;font-family:var(--fm);font-size:11px;color:var(--mu)}

/* STUDENT CARD */
.scard{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;transition:border-color .3s}
.scard.absent{border-color:rgba(255,77,77,.5)}
.scard.warning{border-color:rgba(245,166,35,.4)}
.scard-top{padding:10px 10px 6px;display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:12px;font-weight:700;flex-shrink:0;transition:all .4s}
.av-p{background:rgba(0,229,160,.12);color:var(--gr);border:1.5px solid rgba(0,229,160,.4)}
.av-w{background:rgba(245,166,35,.12);color:var(--wa);border:1.5px solid rgba(245,166,35,.4)}
.av-a{background:rgba(255,77,77,.12);color:var(--da);border:1.5px solid rgba(255,77,77,.4);animation:pp .8s ease-in-out infinite alternate}
.av-o{background:rgba(58,69,96,.15);color:var(--mu);border:1.5px solid var(--bd)}
@keyframes pp{from{opacity:.6}to{opacity:1}}
.scard-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sbadge{padding:2px 7px;border-radius:10px;font-family:var(--fm);font-size:8px;font-weight:700;flex-shrink:0}
.bp{background:rgba(0,229,160,.15);color:var(--gr);border:1px solid rgba(0,229,160,.3)}
.bw{background:rgba(245,166,35,.15);color:var(--wa);border:1px solid rgba(245,166,35,.3)}
.ba{background:rgba(255,77,77,.15);color:var(--da);border:1px solid rgba(255,77,77,.3)}
.bo{background:rgba(58,69,96,.2);color:var(--mu);border:1px solid var(--bd)}
.scard-stats{padding:0 10px 8px;display:flex;justify-content:space-between;font-family:var(--fm);font-size:9px;color:var(--mu)}
.scard-stats .at{color:var(--da)}
.pbar{background:var(--bd);border-radius:2px;height:3px;overflow:hidden;margin:0 10px 8px}
.pbar-fill{height:100%;border-radius:2px;background:var(--gr);transition:width .6s,background .3s}

/* RIGHT PANEL */
.right-panel{border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.rp-section{display:flex;flex-direction:column;overflow:hidden}
.rp-section:first-child{flex:1;min-height:0}
.rp-section:last-child{flex:0 0 200px;border-top:1px solid var(--bd)}
.rp-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
.rp-title{font-family:var(--fm);font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.rp-body{overflow-y:auto;flex:1}
.rp-body::-webkit-scrollbar{width:3px}
.rp-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.alert-row{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--bd);font-size:11px}
.alert-row:last-child{border-bottom:none}
.adot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.at2{font-family:var(--fm);font-size:9px;color:var(--mu);margin-left:auto;padding-left:6px;white-space:nowrap}
.empty-msg{padding:16px 12px;font-family:var(--fm);font-size:10px;color:var(--mu);text-align:center}

/* WS LOG */
.wsrow{padding:4px 12px;border-bottom:1px solid var(--bd);font-family:var(--fm);font-size:9px;color:var(--mu)}
.wsrow:last-child{border-bottom:none}

/* BOTTOM BAR */
.bbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--sf);border-top:1px solid var(--bd);flex-shrink:0}
.btn{font-family:var(--fm);font-size:10px;padding:6px 14px;border-radius:5px;border:1px solid var(--bd);cursor:pointer;background:transparent;color:var(--tx);transition:all .2s}
.btn:hover{background:rgba(255,255,255,.05)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-acc{background:var(--gr);color:#0c0e13;border-color:var(--gr)}
.btn-acc:hover{opacity:.88}
.btn-warn{background:rgba(245,166,35,.15);color:var(--wa);border-color:rgba(245,166,35,.4)}
.thr-row{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;color:var(--mu)}
select{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:3px 7px;font-family:var(--fm);font-size:10px}
</style>
</head>
<body>

<!-- CREATE SCREEN -->
<div id="create-screen">
  <div class="create-card">
    <div class="logo">FACE<em>TRACK</em></div>
    <div class="logo-sub">강사 대시보드 — 수업 세션을 시작하세요</div>
    <div class="field">
      <label>강사 이름</label>
      <input id="inp-name" type="text" placeholder="김선생" autocomplete="off">
    </div>
    <div id="create-err" style="color:var(--da);font-size:12px;font-family:var(--fm);margin-bottom:12px;display:none"></div>
    <button class="btn-create" id="btn-create">세션 만들기</button>
    <hr class="divider">
    <div class="field">
      <label>서버 주소</label>
      <div class="server-row">
        <input id="inp-server" type="text" value="http://localhost:3000" placeholder="http://서버주소:3000">
        <span>기본값</span>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="hdr">
    <div class="hdr-logo">FACE<em>TRACK</em> <span style="font-size:10px;font-weight:400;color:var(--mu);margin-left:6px">강사 대시보드</span></div>
    <div class="hdr-r">
      <div>
        <div class="code-label">세션 코드 (클릭해서 복사)</div>
        <div class="code-badge" id="code-badge" onclick="copyCode()">------</div>
      </div>
      <div class="conn-chip"><span class="cdot" id="cdot"></span><span id="clbl">연결 중</span></div>
    </div>
  </div>

  <div class="stats">
    <div class="sc"><div class="sl">접속 학생</div><div class="sv" id="st-tot">0</div></div>
    <div class="sc"><div class="sl">이탈 중</div><div class="sv" id="st-abs" style="color:var(--da)">0</div></div>
    <div class="sc"><div class="sl">평균 참여율</div><div class="sv" id="st-rate" style="color:var(--gr)">--%</div></div>
    <div class="sc"><div class="sl">세션 시간</div><div class="sv" id="st-time" style="font-size:15px">00:00</div></div>
  </div>

  <div class="body-area">
    <div class="grid-area">
      <div class="grid-label">수강생 현황</div>
      <div class="student-grid" id="sgrid">
        <div class="no-students" id="no-students">학생 입장을 기다리는 중...<br><br><span style="font-size:10px;opacity:.6">세션 코드를 학생들에게 공유하세요</span></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="rp-section">
        <div class="rp-hdr">
          <span class="rp-title">실시간 알림</span>
          <button class="btn" style="padding:2px 8px;font-size:9px" onclick="clearAlerts()">지우기</button>
        </div>
        <div class="rp-body" id="alert-list">
          <div class="empty-msg" id="alert-empty">알림 없음</div>
        </div>
      </div>
      <div class="rp-section">
        <div class="rp-hdr"><span class="rp-title">서버 이벤트 로그</span></div>
        <div class="rp-body" id="ws-log">
          <div class="empty-msg">이벤트 없음</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bbar">
    <button class="btn" id="btn-pause" onclick="togglePause()">일시정지</button>
    <button class="btn btn-acc" id="btn-csv" disabled onclick="exportCSV()">↓ CSV 내보내기</button>
    <div class="thr-row">이탈 기준 <select id="thr-disp"><option value="10">10초</option><option value="20" selected>20초</option><option value="30">30초</option></select></div>
    <button class="btn" style="margin-left:auto;color:var(--da);border-color:rgba(255,77,77,.3)" onclick="endSession()">세션 종료</button>
  </div>
</div>

<script src="/js/instructor.js"></script>
</body>
</html>
