<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceTrack — 수강생</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e13;--sf:#12151c;--card:#171b24;--bd:#1c2133;
  --gr:#00e5a0;--wa:#f5a623;--da:#ff4d4d;--tx:#dde4f0;--mu:#3a4560;
  --fm:'JetBrains Mono',monospace;--fb:'Noto Sans KR',sans-serif;
}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;display:flex;flex-direction:column}

/* JOIN SCREEN */
#join-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.join-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:36px 32px;width:100%;max-width:420px}
.join-logo{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--gr);letter-spacing:.12em;margin-bottom:6px}
.join-logo em{color:var(--mu);font-style:normal}
.join-sub{font-size:13px;color:var(--mu);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;font-family:var(--fm)}
.field input{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;color:var(--tx);font-family:var(--fb);font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--gr)}
.field input::placeholder{color:var(--mu)}
.err{color:var(--da);font-size:12px;margin-top:8px;font-family:var(--fm);display:none}
.btn-join{width:100%;background:var(--gr);color:#0c0e13;border:none;border-radius:8px;padding:12px;font-family:var(--fm);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.06em;transition:opacity .2s;margin-top:8px}
.btn-join:hover{opacity:.88}
.divider{border:none;border-top:1px solid var(--bd);margin:20px 0}
.server-url-row{display:flex;gap:8px;align-items:center}
.server-url-row input{flex:1;font-size:12px}
.server-url-row span{font-size:11px;color:var(--mu);white-space:nowrap;font-family:var(--fm)}

/* TRACKER SCREEN */
#tracker-screen{display:none;flex-direction:column;height:100vh}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
.top-logo{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--gr);letter-spacing:.1em}
.top-logo em{color:var(--mu);font-style:normal}
.user-chip{font-family:var(--fm);font-size:11px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--mu);display:inline-block;margin-right:4px}
.conn-dot.ok{background:var(--gr)}
.conn-dot.err{background:var(--da)}

.main-area{display:grid;grid-template-columns:1fr 200px;gap:12px;padding:12px;flex:1;min-height:0;overflow:hidden}
.cam-wrap{position:relative;background:#080a0f;border-radius:10px;overflow:hidden;border:1px solid var(--bd);height:100%}
.cam-wrap video,.cam-wrap canvas{width:100%;height:100%;object-fit:cover;display:block}
.cam-wrap canvas{position:absolute;top:0;left:0;transform:scaleX(-1)}
.cam-wrap video{transform:scaleX(-1)}
.cam-timestamp{position:absolute;top:7px;left:9px;font-family:var(--fm);font-size:9px;color:rgba(255,255,255,.4);pointer-events:none}
.status-pill{position:absolute;bottom:8px;left:8px;padding:4px 12px;border-radius:20px;font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.06em;transition:all .3s}
.sp-p{background:rgba(0,229,160,.15);color:var(--gr);border:1px solid rgba(0,229,160,.3)}
.sp-w{background:rgba(245,166,35,.15);color:var(--wa);border:1px solid rgba(245,166,35,.3)}
.sp-a{background:rgba(255,77,77,.15);color:var(--da);border:1px solid rgba(255,77,77,.3)}
.sp-i{background:rgba(58,69,96,.2);color:var(--mu);border:1px solid var(--bd)}
.cam-conf{position:absolute;top:7px;right:9px;font-family:var(--fm);font-size:9px;color:rgba(255,255,255,.4);pointer-events:none}

.side-panel{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.scard-label{font-family:var(--fm);font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.scard-val{font-family:var(--fm);font-size:18px;font-weight:700;line-height:1;margin-bottom:3px}
.scard-sub{font-size:11px;color:var(--mu)}
.meter{background:var(--bd);border-radius:3px;height:5px;overflow:hidden;margin-top:6px}
.meter-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}

.sig-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sig-box{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:8px 10px}
.sig-lbl{font-family:var(--fm);font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.sig-val{font-family:var(--fm);font-size:16px;font-weight:700}
.sig-bar{background:var(--bd);border-radius:2px;height:3px;overflow:hidden;margin-top:5px}
.sig-bar-fill{height:100%;border-radius:2px;transition:width .25s,background .3s}

.log-area{padding:0 12px 12px;flex-shrink:0}
.log-panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.log-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;background:var(--sf);border-bottom:1px solid var(--bd)}
.log-title{font-family:var(--fm);font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.log-body{max-height:100px;overflow-y:auto}
.log-body::-webkit-scrollbar{width:3px}
.log-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.log-row{display:flex;justify-content:space-between;padding:5px 11px;border-bottom:1px solid var(--bd);font-family:var(--fm);font-size:10px}
.log-row:last-child{border-bottom:none}
.log-row .lt{color:var(--mu)}
.log-row .ld{color:var(--da);font-weight:700}
.log-row .lm{color:var(--gr);font-size:9px}

.bottom-bar{padding:8px 12px;background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-sm{font-family:var(--fm);font-size:10px;padding:5px 12px;border-radius:5px;border:1px solid var(--bd);cursor:pointer;background:transparent;color:var(--tx);transition:all .2s}
.btn-sm:hover{background:rgba(255,255,255,.05)}
.btn-sm:disabled{opacity:.3;cursor:not-allowed}
.btn-acc{background:var(--gr);color:#0c0e13;border-color:var(--gr)}
.btn-acc:hover{opacity:.88}
.thr-row{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;color:var(--mu)}
select{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:3px 7px;font-family:var(--fm);font-size:10px}

.pause-banner{display:none;background:rgba(245,166,35,.1);border-bottom:1px solid rgba(245,166,35,.3);padding:7px 14px;text-align:center;font-family:var(--fm);font-size:11px;color:var(--wa);letter-spacing:.04em;flex-shrink:0}

/* LOAD OVERLAY */
.load-ov{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;border-radius:10px}
.load-bar-w{width:75%;background:var(--bd);border-radius:3px;height:3px;overflow:hidden}
.load-bar{height:100%;background:var(--gr);animation:lp 2.5s ease-out forwards}
@keyframes lp{0%{width:0}60%{width:70%}100%{width:100%}}
.load-txt{font-family:var(--fm);font-size:10px;color:var(--mu)}
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen">
  <div class="join-card">
    <div class="join-logo">FACE<em>TRACK</em></div>
    <div class="join-sub">집중도 모니터링 — 시선·졸음·자리 (MediaPipe)</div>
    <div class="field">
      <label>이름</label>
      <input id="inp-name" type="text" placeholder="홍길동" autocomplete="off">
    </div>
    <div class="field">
      <label>세션 코드 (강사에게 받은 코드)</label>
      <input id="inp-code" type="text" placeholder="ABC12" maxlength="5" style="text-transform:uppercase;letter-spacing:.15em;font-family:var(--fm);font-size:18px" autocomplete="off">
    </div>
    <div class="err" id="join-err"></div>
    <button class="btn-join" id="btn-join">입장하기</button>
    <hr class="divider">
    <div class="field">
      <label>서버 주소</label>
      <div class="server-url-row">
        <input id="inp-server" type="text" value="http://localhost:3000" placeholder="http://서버주소:3000">
        <span>기본값</span>
      </div>
    </div>
  </div>
</div>

<!-- TRACKER -->
<div id="tracker-screen">
  <div class="pause-banner" id="pause-banner">일시정지 중 — 강사가 감지를 일시 중단했습니다</div>
  <div class="top-bar">
    <div class="top-logo">FACE<em>TRACK</em></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="user-chip" id="user-chip">-</span>
      <span style="font-family:var(--fm);font-size:10px;color:var(--mu)"><span class="conn-dot" id="conn-dot"></span><span id="conn-lbl">연결 중</span></span>
    </div>
  </div>

  <div class="main-area">
    <div class="cam-wrap" id="cam-wrap">
      <video id="vid" autoplay muted playsinline></video>
      <canvas id="cvs"></canvas>
      <div class="cam-timestamp" id="ts-lbl">--:--:--</div>
      <div class="cam-conf" id="conf-lbl"></div>
      <div class="status-pill sp-i" id="spill">IDLE</div>
      <div class="load-ov" id="load-ov">
        <div class="load-bar-w"><div class="load-bar"></div></div>
        <div class="load-txt" id="load-txt">모델 로딩 중...</div>
      </div>
    </div>

    <div class="side-panel">
      <div class="sig-row">
        <div class="sig-box">
          <div class="sig-lbl">얼굴</div>
          <div class="sig-val" id="face-v" style="color:var(--mu)">--</div>
          <div class="sig-bar"><div class="sig-bar-fill" id="face-b" style="width:0%;background:var(--mu)"></div></div>
        </div>
        <div class="sig-box">
          <div class="sig-lbl">졸음 EAR</div>
          <div class="sig-val" id="mot-v" style="color:var(--mu)">--</div>
          <div class="sig-bar"><div class="sig-bar-fill" id="mot-b" style="width:0%;background:var(--mu)"></div></div>
        </div>
        <div class="sig-box">
          <div class="sig-lbl">머리각</div>
          <div class="sig-val" id="pose-v" style="color:var(--mu)">--</div>
          <div class="sig-bar"><div class="sig-bar-fill" id="pose-b" style="width:0%;background:var(--mu)"></div></div>
        </div>
      </div>
      <div class="scard">
        <div class="scard-label">참여율</div>
        <div class="scard-val" id="rate-v" style="color:var(--gr)">--%</div>
        <div class="scard-sub">문서 §6 (60초 롤링)</div>
        <div class="meter"><div class="meter-fill" id="rate-b" style="width:0%;background:var(--gr)"></div></div>
      </div>
      <div class="scard">
        <div class="scard-label">이탈 현황</div>
        <div class="scard-val" id="cnt-v">0회</div>
        <div class="scard-sub" id="tot-abs">총 이탈 --</div>
      </div>
      <div class="scard">
        <div class="scard-label">현재 이탈</div>
        <div class="scard-val" id="cur-v" style="color:var(--mu);font-size:14px">대기 중</div>
        <div class="scard-sub" id="sess-t">세션: 00:00</div>
      </div>
    </div>
  </div>

  <div class="log-area">
    <div class="log-panel">
      <div class="log-hdr">
        <span class="log-title">이탈 기록</span>
      </div>
      <div class="log-body" id="log-body">
        <div style="padding:12px;font-family:var(--fm);font-size:10px;color:var(--mu);text-align:center" id="log-empty">기록 없음</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-sm btn-acc" id="btn-start" disabled>카메라 시작</button>
    <button class="btn-sm" id="btn-stop" disabled>중지</button>
    <div class="thr-row">
      이탈 기준 <span id="thr-val" style="font-family:var(--fm);font-size:10px;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:3px 8px">5s</span>
      <span style="font-size:9px;color:var(--mu)">문서 §4.2</span>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/student.js"></script>
</body>
</html>
